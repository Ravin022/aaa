<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - OpenRouter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>AI Chat</h1>
                <p class="subtitle">Powered by OpenRouter</p>
            </div>

            <div class="model-selector">
                <label for="model-select">Select Model</label>
                <select id="model-select">
                    <option value="">Loading models...</option>
                </select>
            </div>

            <div class="conversations">
                <div class="conversations-header">
                    <h3>Conversations</h3>
                    <button id="new-chat-btn" title="New Chat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div id="conversation-list" class="conversation-list">
                    <!-- Conversations will be dynamically added here -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="clear-all-btn" class="danger-btn">Clear All Chats</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <div class="current-model">
                    <span id="current-model-name">Select a model to start</span>
                </div>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <h2>Welcome to AI Chat!</h2>
                    <p>Select a model from the sidebar and start chatting with AI.</p>
                    <p class="hint">All models are free to use via OpenRouter.</p>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea
                        id="message-input"
                        placeholder="Type your message here... (Press Enter to send, Shift+Enter for new line)"
                        rows="1"
                    ></textarea>
                    <button id="send-btn" title="Send Message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
